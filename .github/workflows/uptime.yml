# Based on the Upptime v1.46.3 template (https://github.com/upptime/upptime, MIT).
# Changes: actions pinned by SHA, explicit token permissions, GitHub App / PAT
# token steps removed (the built-in GITHUB_TOKEN is used; no secrets).
name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          # Upptime commits its data back to this repo with this token.
          persist-credentials: true # zizmor: ignore[artipacked]
      - name: Check endpoint status
        uses: upptime/uptime-monitor@6d218cca63a6249035b9f3b52765ee501cf88b20 # v1.46.3
        with:
          command: "update"
        env:
          GH_PAT: ${{ github.token }}
